{% extends "core/base.html" %}
{% block content %}
<div class="auth-shell">
  <img src="/static/images/logo.png" class="auth-visual" alt="">

  <div>
    <div class="auth-brand">
      <img src="/static/images/icon.png" alt="">
      <span>Questy</span>
    </div>

    <form class="card auth-card" action="/auth/signup" method="post">
      <div class="card-body">
        <h1 class="h2 mb-2">Create account</h1>
        <p class="text-muted mb-4">Start creating quests for teams and friends.</p>

        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <button type="submit" class="btn btn-auth btn-primary w-100">Create account</button>
      </div>
    </form>

    <div class="auth-links text-muted">
      Already have an account? <a href="/auth/login">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
