{% extends "core/base.html" %}
{% block content %}
<div class="auth-shell">
  <img src="/static/images/auth-visual.svg" class="auth-visual" alt="">

  <div>
    <div class="auth-brand">
      <img src="/static/images/questy-mark.svg" alt="">
      <span>Questy</span>
    </div>

    <div class="card auth-card">
      <div class="card-body">
        <h1 class="h2 mb-2">Check your email</h1>
        <p class="text-muted mb-4">We sent you a confirmation link. After you open it, you will be signed in automatically.</p>

        <div class="d-flex gap-2">
          <a href="/login" class="btn btn-primary">Go to login</a>
          <a href="/signup" class="btn btn-outline-secondary">Try again</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
