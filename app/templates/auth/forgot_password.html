{% extends "core/base.html" %}
{% block content %}
<div class="auth-shell">
  <img src="/static/images/auth-visual.svg" class="auth-visual" alt="">

  <div>
    <div class="auth-brand">
      <img src="/static/images/questy-mark.svg" alt="">
      <span>Questy</span>
    </div>

    <div class="card auth-card">
      <div class="card-body">
        <h1 class="h2 mb-2">Reset password</h1>
        <p class="text-muted mb-4">Password reset is not connected yet. For now, return to login or create a new account.</p>

        <div class="d-flex gap-2">
          <a href="/auth/login" class="btn btn-primary">Back to login</a>
          <a href="/auth/signup" class="btn btn-outline-secondary">Create account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
