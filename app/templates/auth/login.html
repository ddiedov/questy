{% extends "core/base.html" %}
{% block content %}
<div class="auth-shell">
  <img src="/static/images/logo.png" class="auth-visual" alt="">

  <div>
    <div class="auth-brand">
      <img src="/static/images/icon.png" alt="">
      <span>Questy</span>
    </div>

    <form class="card auth-card" action="/auth/login" method="post">
      <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
      <div class="card-body">
        <h1 class="h2 mb-2">Login</h1>
        <p class="text-muted mb-4">Continue building and playing quests.</p>

        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </div>
    </form>

    <div class="auth-links text-muted">
      No account yet? <a href="/auth/signup">Create one</a>
      <span class="mx-2">.</span>
      <a href="/forgot-password">Forgot password?</a>
    </div>
  </div>
</div>
{% endblock %}
