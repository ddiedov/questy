<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">

    <!-- LEFT: Brand + Section -->
    <div class="d-flex align-items-center gap-4">

      <!-- BRAND -->
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
          <img src="/static/images/icon3.png" 
              alt="Questy" 
              class="navbar-brand-mark">
          <span>Questy</span>
      </a>

    </div>

    <!-- RIGHT -->
    <div class="d-flex align-items-center gap-3 ms-auto">

      {% set profile = request.state.profile %}

      {% if profile %}
        <!-- USER -->
        <div class="dropdown">

          <a class="d-flex align-items-center text-decoration-none custom-user-toggle"
             href="#"
             data-bs-toggle="dropdown">

            <img src="{{ profile.avatar_url or '/static/images/default-avatar.svg' }}"
                class="avatar">

            <span class="ms-2 navbar-user-name">
                {{ profile.display_name or profile.username or 'User' }}
            </span>

            <i class="bi bi-chevron-down user-chevron ms-1"></i>
          </a>

          <ul class="dropdown-menu dropdown-menu-end">

            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="/profiles/me">
                <i class="bi bi-person"></i>
                <span>Profile</span>
              </a>
            </li>

            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="/auth/logout">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
              </a>
            </li>

          </ul>
        </div>

      {% else %}

        <a href="/auth/login" class="btn btn-auth btn-secondary">Login</a>
        <a href="/auth/signup" class="btn btn-auth btn-primary">Sign Up</a>

      {% endif %}
      
    </div>

  </div>
</nav>
