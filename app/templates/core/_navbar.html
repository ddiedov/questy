<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">

    <!-- LEFT: Brand + Section -->
    <div class="d-flex align-items-center gap-4">

      <!-- BRAND -->
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
        <img src="/static/images/icon3.png" alt="" class="navbar-brand-mark">
        Questy
      </a>

      <!-- CURRENT SECTION -->
      <span class="text-muted d-flex align-items-center gap-1">
        <i class="bi bi-map"></i>
        <span class="fw-semibold">{% block title %}QUESTS{% endblock %}</span>
      </span>

    </div>

    <!-- RIGHT -->
    <div class="d-flex align-items-center gap-3 ms-auto">

      <!-- Optional action -->
      <a href="#" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-eye"></i> Preview
      </a>

      {% set profile = request.state.profile %}

      {% if profile %}
        <!-- USER -->
        <div class="dropdown">

          <a class="d-flex align-items-center text-decoration-none dropdown-toggle"
             href="#"
             data-bs-toggle="dropdown">

            <img src="{{ profile.avatar_url or '/static/images/default-avatar.svg' }}"
                class="avatar">

            <span class="ms-2 small">
                {{ profile.display_name or profile.username or 'User' }}
            </span>
          </a>

          <ul class="dropdown-menu dropdown-menu-end">

            <li>
              <a class="dropdown-item" href="/profiles/me">
                <i class="bi bi-person"></i> Profile
              </a>
            </li>

            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item" href="/auth/logout">
                <i class="bi bi-box-arrow-right"></i> Logout
              </a>
            </li>

          </ul>
        </div>

      {% else %}

        <a href="/auth/login" class="nav-link">Login</a>
        <a href="/auth/signup" class="btn btn-primary btn-sm">Sign Up</a>

      {% endif %}
      
    </div>

  </div>
</nav>
