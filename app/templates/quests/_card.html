<div class="qs-card">
    <div class="qs-image">
        <img src="{{ quest.image_url or '/static/images/placeholder.svg' }}">
        <div class="qs-overlay"></div>
    </div>
    <div class="qs-body">
        <div class="qs-meta">
            QUEST
        </div>

        <h3 class="qs-title">
            {{ quest.title }}
        </h3>

        <p class="qs-desc">
            {{ quest.description | safe }}
        </p>
        
        <div class="qs-cta">
            {% include "quests/_quest_actions_list.html" %}

            <a href="/quests/{{ quest.id }}" class="btn btn-forward btn-secondary">
                View
            </a>
        </div>
    </div>
</div>
