{% set quest_image = quest.image_url or '/static/images/placeholder.svg' %}

<a href="/quests/{{ quest.id }}" class="landing-tile">

    <div class="landing-tile-image">

        <img src="{{ quest_image }}" alt="{{ quest.title }}">

        <div class="landing-tile-overlay"></div>

        <div class="landing-tile-badge">
            Adventure
        </div>

    </div>

    <div class="landing-tile-body">

        <h3>{{ quest.title }}</h3>

        <p>{{ quest.description | safe }}</p>

        <div class="landing-tile-cta">
            Begin →
        </div>

    </div>

</a>
