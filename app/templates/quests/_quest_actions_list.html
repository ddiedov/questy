{% if quest.is_author %}

    <a href="/quests/{{ quest.id }}/edit"
       class="btn btn-warning">
        Edit
    </a>

{% else %}

    {% if not request.state.user %}

        <a href="/auth/login"
           class="btn btn-outline-primary">
            Login to participate
        </a>

    {% elif quest.application_status == "approved" %}

        {% if quest.state.state == "resume" %}

            <a href="/quest-runs/{{ quest.state.run_id }}"
               class="btn btn-primary">
                Resume
            </a>

        {% else %}

            <a href="/quests/{{ quest.id }}"
               class="btn btn-success">
                Open
            </a>

        {% endif %}

    {% elif quest.application_status == "new" %}

        <button class="btn btn-secondary"
                disabled>
            Awaiting approval
        </button>

    {% else %}

        <form method="post"
              action="/quest-applications"
              class="d-inline">

            <input type="hidden"
                   name="quest_id"
                   value="{{ quest.id }}">

            <input type="hidden"
                   name="participant_id"
                   value="{{ request.state.user.id }}">

            <input type="hidden"
                   name="participant_type"
                   value="individual">

            <input type="hidden"
                   name="next"
                   value="/quests/{{ quest.id }}">

            <button type="submit"
                    class="btn btn-success">
                Apply
            </button>

        </form>

    {% endif %}

{% endif %}
