{% extends "core/base.html" %}

{% block content %}

<div class="container py-4 profile-page">

  <!-- PAGE HEADER -->
  <div class="mb-4">

    <h1 class="h3 mb-1 fw-bold">
      My Profile
    </h1>

    <div class="text-muted">
      Manage your public profile information
    </div>

  </div>

  <!-- CARD -->
  <div class="card border-0 shadow-sm">

    <div class="card-body p-4">

      <form
        method="post"
        enctype="multipart/form-data"
        class="d-flex flex-column gap-4"
      >

        <!-- AVATAR SECTION -->
        <div>

        <label class="form-label fw-semibold d-block mb-3">
            Profile Photo
        </label>

        <div class="d-flex align-items-center gap-4">

            <!-- AVATAR PREVIEW -->
            <img
            id="avatar-preview"
            src="{{ profile.avatar_url or '/static/images/default-avatar.svg' }}"
            class="profile-avatar rounded-circle border shadow-sm"
            >

            <!-- ACTIONS -->
            <div class="d-flex flex-column gap-2">

            <!-- HIDDEN INPUT -->
            <input
                type="hidden"
                name="avatar_url"
                id="avatar-url-input"
                value="{{ profile.avatar_url or '' }}"
            >

            <!-- FILE INPUT -->
            <input
                type="file"
                id="image-input"
                accept="image/*"
                class="d-none"

                data-upload-url="/profiles/me/avatar"
                data-preview-target="#avatar-preview"
                data-hidden-input="#avatar-url-input"
            >

            <!-- BUTTON -->
            <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="document.getElementById('image-input').click()"
            >
                <i class="bi bi-upload"></i>
                Upload Photo
            </button>

            <div class="text-muted small">
                JPG, PNG, WEBP up to 5MB
            </div>

            </div>

        </div>

        </div>

        <!-- USERNAME -->
        <div>

          <label class="form-label fw-semibold">
            Username
          </label>

          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="john_doe"
            value="{{ profile.username or '' }}"
            required
          >

          <div class="form-text">
            Used in your public profile URL
          </div>

        </div>

        <!-- DISPLAY NAME -->
        <div>

          <label class="form-label fw-semibold">
            Display Name
          </label>

          <input
            type="text"
            name="display_name"
            class="form-control"
            placeholder="John Doe"
            value="{{ profile.display_name or '' }}"
          >

        </div>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-end pt-2">

          <button
            type="submit"
            class="btn btn-primary"
          >
            <i class="bi bi-check-lg"></i>
            Save Changes
          </button>

        </div>

      </form>

    </div>

  </div>

</div>

{% endblock %}
